name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate-json:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Parse every JSON config
        run: .github/scripts/ci/validate-json.sh
      - name: Shape assertions
        run: .github/scripts/ci/assert-shapes.sh

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Run shellcheck
        run: .github/scripts/ci/shellcheck-all.sh

  discover-tests:
    runs-on: ubuntu-latest
    outputs:
      plugins: ${{ steps.find.outputs.plugins }}
    steps:
      - uses: actions/checkout@v6
      - id: find
        run: .github/scripts/ci/discover-tests.sh >> "$GITHUB_OUTPUT"

  plugin-tests:
    needs: discover-tests
    if: needs.discover-tests.outputs.plugins != '[]'
    strategy:
      fail-fast: false
      matrix:
        plugin: ${{ fromJSON(needs.discover-tests.outputs.plugins) }}
    uses: dangernoodle-io/.github/.github/workflows/plugin-test.yml@main
    with:
      plugin-path: plugins/${{ matrix.plugin }}

  scripts-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install bats
        run: sudo apt-get update && sudo apt-get install -y bats
      - name: Run .scripts bats tests
        run: bats .scripts/*.bats

  ci-success:
    if: always()
    needs: [validate-json, shellcheck, discover-tests, plugin-tests, scripts-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check all jobs succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: .github/scripts/ci/check-needs.sh
